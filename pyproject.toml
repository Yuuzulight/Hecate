[project]
name = "hecate"
version = "0.1.0"
description = "Repository intelligence platform: multi-source ETL over GitHub, npm, PyPI and GitLab"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "psycopg2-binary==2.9.12",
    "requests==2.34.2",
    "prometheus-client==0.26.0",
    "python-dotenv==1.2.2",
    # - Small and pure Python, so it sits in the base set rather than behind an
    #   extra like dbt. Nothing breaks without a Redis to talk to: the cache
    #   degrades to a miss and the retriever answers from PostgreSQL.
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# - Kept out of requirements.txt on purpose: dbt is a separate tool that runs
#   against the database, not something the pipeline image needs to carry.
dbt = ["dbt-core==1.12.0", "dbt-postgres==1.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live PostgreSQL, skipped when there isn't one",
]
# - Without this, pytest only finds the pipeline package when it happens to be
#   run from the repo root.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
