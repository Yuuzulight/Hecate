# Autoscaling for the metrics deployment.
#
# Needs metrics-server in the cluster, which Docker Desktop does not ship:
#
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch deployment metrics-server -n kube-system --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# The patch is needed because Docker Desktop's kubelet serving certificates are
# not signed by the cluster CA. Without metrics-server the HPA still applies
# cleanly, it just reports <unknown> for every target and never acts.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hecate-metrics
  namespace: hecate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hecate-metrics

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      # - React immediately. Being slow to add capacity is the expensive
      #   direction to be wrong in.
      stabilizationWindowSeconds: 0
    scaleDown:
      # - Wait five minutes before giving capacity back, so a brief dip does
      #   not start a cycle of scaling down and straight back up.
      stabilizationWindowSeconds: 300
