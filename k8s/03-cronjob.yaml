# Daily extraction run.
#
# Pulls a published, versioned image, so nothing has to be side-loaded onto the
# node and there is no way to end up running a stale build under a tag that
# never changed.
#
# To run an unreleased build instead, put it on the node and pin the policy:
#
#   docker save hecate:dev | docker exec -i desktop-control-plane \
#     ctr -n k8s.io images import -
#
# then set image: hecate:dev with imagePullPolicy: Never. Re-import after every
# rebuild - the tag stays put, so a stale copy keeps running happily and the
# only symptom is the pipeline quietly collecting from fewer sources than it
# should.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: hecate-daily
  namespace: hecate
spec:
  # 02:00 UTC, when the APIs are quiet.
  schedule: "0 2 * * *"

  # - Suspended, because the machine is not on all day and a fixed UTC time
  #   would be missed more often than met. ops/windowed-run.ps1 starts Docker
  #   once a day, creates a Job from this template, and shuts it down again.
  #   The spec below is still the only definition of the job; the schedule is
  #   what it would run at if the cluster were always up.
  #
  #   Back to the clock:
  #   kubectl patch cronjob hecate-daily -n hecate -p '{"spec":{"suspend":false}}'
  suspend: true

  # - A run that overruns should not have the next one land on top of it. Both
  #   would be writing the same rows, and the upsert would have them fighting
  #   over the same keys.
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600

  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            # - Gives the NetworkPolicy something stable to match on; job pods
            #   otherwise only carry generated labels.
            app: hecate-pipeline
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pipeline
              image: ghcr.io/yuuzulight/hecate:2.0.0
              env:
                - name: DB_HOST
                  value: postgres.hecate.svc.cluster.local
                - name: DB_NAME
                  value: hecate
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: password
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: github-token
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: gitlab-token
                - name: BATCH_SIZE
                  value: "500"
                # - Where drain() (pipeline/realtime/drain.py) reads the
                #   real-time npm/HN streams from. Without this the bus
                #   builds with client=None and drain() silently no-ops
                #   every run, even though the listeners keep publishing -
                #   see ops/realtime/README.md for the Memurai bind-address
                #   step this still needs before it actually connects.
                - name: REDIS_REALTIME_URL
                  value: redis://host.docker.internal:6380/0
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
