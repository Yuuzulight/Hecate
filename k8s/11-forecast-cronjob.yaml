# Forecasts star growth for the top 50 repositories by recent velocity, after
# collection and dbt on the same reasoning as the other jobs: it reads
# raw_repositories and repository_snapshots directly, not a dbt mart, so it
# doesn't strictly need hecate-dbt to have run first - but the slot keeps
# every real-time/derived-data job grouped together for a reader.
#
# Optional, like hecate-embed: a failure here is logged and does not fail
# the day. This is new, ML-dependency-heavy, and forecasts are inherently
# best-effort while Hecate's own history is still short - see
# docs/specs/2026-08-15-timesfm-forecasting-design.md.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: hecate-forecast
  namespace: hecate
spec:
  schedule: "45 3 * * *"

  # - Suspended like the others; the windowed run creates the Job. See
  #   03-cronjob.yaml for why the schedule above is documentation rather
  #   than something that fires.
  suspend: true

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600

  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hecate-pipeline
        spec:
          restartPolicy: OnFailure
          containers:
            - name: forecast
              # - Built from --target forecast and side-loaded onto the node,
              #   not pulled: unlike hecate/hecate-dbt/hecate-rag this one has
              #   never been published, so the dev tag is what actually exists.
              #   The side-loaded pattern is the one 03-cronjob.yaml documents:
              #
              #     docker build --target forecast -t hecate-forecast:dev .
              #     docker save hecate-forecast:dev | docker exec -i \
              #       desktop-control-plane ctr -n k8s.io images import -
              #
              #   Re-import after every rebuild - the tag stays put, so a stale
              #   copy keeps forecasting happily off old code.
              #
              # - The policy is pinned here rather than patched onto the live
              #   CronJob. It was patched once, on 2026-08-16, while the image
              #   above still named the unpublished ghcr tag: Never plus a name
              #   the node does not have is ErrImageNeverPull forever, and the
              #   kubelet retries it without ever failing the Job, so the
              #   windowed run spent its whole 1200s ceiling waiting on a
              #   container that had not started. Keeping both halves in the
              #   manifest is what stops that pairing coming back.
              image: hecate-forecast:dev
              imagePullPolicy: Never
              env:
                - name: DB_HOST
                  value: postgres.hecate.svc.cluster.local
                - name: DB_NAME
                  value: hecate
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: password
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
