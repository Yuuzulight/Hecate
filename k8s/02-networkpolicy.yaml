# Without this, any pod anywhere in the cluster can open a connection to the
# database. This closes it to the three workloads that need one.
#
# NetworkPolicy needs a CNI that enforces it. Docker Desktop's built-in cluster
# does not, so applying this there is documentation rather than protection -
# check with a test pod before relying on it.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-restricted
  namespace: hecate
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        # - The scheduled extraction job. Its pods carry this label from the
        #   job template; there is no stable generated label to match on.
        - podSelector:
            matchLabels:
              app: hecate-pipeline
        # - The metrics exporter.
        - podSelector:
            matchLabels:
              app: hecate-metrics
        # - The nightly dbt rebuild.
        - podSelector:
            matchLabels:
              app: hecate-dbt
        # - The nightly dump.
        - podSelector:
            matchLabels:
              app: hecate-backup
        # - Grafana, which queries the marts directly.
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 5432
