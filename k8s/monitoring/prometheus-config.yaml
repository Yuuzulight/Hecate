# Prometheus needs to read pods from the API to find its targets, so it gets a
# service account with list access rather than a hardcoded target list.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: hecate

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hecate-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hecate-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hecate-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: hecate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hecate
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # - Discovers anything in the namespace carrying prometheus.io/scrape,
      #   so a new component becomes a target by annotating it rather than by
      #   editing this file.
      - job_name: hecate-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [hecate]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
