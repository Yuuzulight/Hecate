# Grafana with two datasources.
#
# Prometheus answers how the pipeline is behaving. Postgres answers what it
# collected - the dbt marts are the right place for "repositories by language",
# and turning analytical questions into Prometheus metrics would be building a
# worse database on top of a good one.
#
# The dashboard lives in dashboards/hecate.json rather than inline here, so it
# stays editable in Grafana and readable in review. It sits in a subdirectory
# because `kubectl apply -f k8s/monitoring/` would otherwise try to apply the
# dashboard as a manifest and fail on it. Load it before applying this file:
#
#   kubectl create configmap grafana-dashboard -n hecate \
#     --from-file=hecate.json=k8s/monitoring/dashboards/hecate.json \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: hecate
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: Postgres
        uid: postgres
        type: grafana-postgresql-datasource
        access: proxy
        url: postgres.hecate.svc.cluster.local:5432
        database: hecate
        user: $DB_USER
        jsonData:
          sslmode: disable
        secureJsonData:
          password: $DB_PASSWORD

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: hecate
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: hecate
        type: file
        folder: ''
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hecate
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          ports:
            - name: web
              containerPort: 3000
          env:
            # - Anonymous access is on, but read-only. Checking a dashboard
            #   daily for a month is not worth a login each time, and the
            #   thing being protected is a list of public repositories.
            #
            #   Viewer, explicitly. The trap here is anonymous-with-admin-
            #   rights, which is fine right up until the first time it is
            #   port-forwarded somewhere shared - anyone reaching it could
            #   then edit dashboards and read the datasource config. Editing
            #   still needs the admin password from the secret.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: grafana-password
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard
        - name: alerting
          configMap:
            name: grafana-alerting

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hecate
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
