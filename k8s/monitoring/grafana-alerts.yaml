# Alerts on the conditions Prometheus cannot see.
#
# The Prometheus rules cover liveness: is the job running, is the exporter up,
# are errors climbing. What they cannot reach is the data itself, because it
# lives in Postgres and Prometheus does not speak to Postgres.
#
# A source whose row count collapses, or a quality rate sliding, is a pipeline
# that runs perfectly and produces rubbish - which is the failure mode this
# project has hit most often. These are the rules for that.
#
# Provisioned rather than clicked in, so they survive a pod restart.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: hecate
data:
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: hecate-webhook
        receivers:
          - uid: hecate-webhook
            type: webhook
            settings:
              # - The same sink Alertmanager posts to, so everything arrives in
              #   one place regardless of which system noticed.
              url: http://alertmanager-sink:8080/
    policies:
      - orgId: 1
        receiver: hecate-webhook
        group_by: ['alertname']

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: hecate-data
        folder: Hecate
        interval: 10m
        rules:
          - uid: hecate-quality
            title: Data quality has dropped
            condition: threshold
            annotations:
              summary: >-
                Stored rows are failing the checks the pipeline applies. The job
                is running; what it is producing is the problem.
            for: 30m
            labels:
              severity: warning
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: postgres
                model:
                  format: table
                  rawQuery: true
                  rawSql: >-
                    SELECT round(100.0 * count(*) FILTER (
                      WHERE url LIKE 'http%'
                        AND (created_at IS NULL OR created_at <= now())
                        AND stars >= 0
                    ) / NULLIF(count(*), 0), 1) AS quality
                    FROM analytics_marts.fct_repositories
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator: { type: lt, params: [99] }
                  refId: threshold

          - uid: hecate-source-collapse
            title: A source has stopped contributing
            annotations:
              summary: >-
                One source is returning far fewer rows than the others. The run
                will have reported success, because a source that returns little
                has not failed.
            condition: threshold
            for: 1h
            labels:
              severity: warning
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: postgres
                model:
                  format: table
                  rawQuery: true
                  # - Smallest source as a share of the largest. Relative, so it
                  #   does not need retuning every time BATCH_SIZE changes.
                  rawSql: >-
                    SELECT round(100.0 * min(repository_count)
                                 / NULLIF(max(repository_count), 0), 1) AS ratio
                    FROM analytics_marts.dim_sources
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator: { type: lt, params: [10] }
                  refId: threshold

          - uid: hecate-discovery-idle
            title: Nothing has been discovered in a week
            annotations:
              summary: >-
                No project has entered the dataset by being discussed for seven
                days. Either the mention sources have gone quiet or resolution
                has broken - both look like success from the job's side.
            condition: threshold
            for: 2h
            labels:
              severity: info
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: postgres
                model:
                  format: table
                  rawQuery: true
                  rawSql: >-
                    SELECT count(*) AS found
                    FROM raw_repositories
                    WHERE origin = 'discovered'
                      AND loaded_at > now() - interval '7 days'
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator: { type: lt, params: [1] }
                  refId: threshold

          # - Phase 2. Both of these read the evaluation table, which is why
          #   they are here rather than in the Prometheus rules: the scores live
          #   in Postgres, and Prometheus does not speak to Postgres.
          - uid: hecate-hallucination
            title: Answers are being invented
            condition: threshold
            annotations:
              summary: >-
                More than 2% of evaluated answers failed faithfulness. The
                service is up and answering; what it is saying is the problem,
                and a fluent wrong answer reads exactly like a correct one.
            # - Sustained, because the question set is small enough that one bad
            #   answer in a twelve-question run is over 8%. A single run
            #   tripping this is noise; two hours of it is a change.
            for: 2h
            labels:
              severity: critical
            data:
              - refId: query
                relativeTimeRange: { from: 86400, to: 0 }
                datasourceUid: postgres
                model:
                  format: table
                  rawQuery: true
                  # - Unscored answers are excluded from both halves rather than
                  #   counted as good. A judge that could not be reached is an
                  #   outage, not a clean bill of health.
                  rawSql: >-
                    SELECT round(100.0 * count(*) FILTER (WHERE hallucination)
                                 / NULLIF(count(*) FILTER (
                                     WHERE hallucination IS NOT NULL), 0), 1)
                           AS rate
                    FROM rag_evaluations
                    WHERE evaluated_at > now() - interval '24 hours'
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator: { type: gt, params: [2] }
                  refId: threshold

          - uid: hecate-faithfulness
            title: Faithfulness is falling
            condition: threshold
            annotations:
              summary: >-
                Mean faithfulness has dropped below 0.8. This catches a slide the
                hallucination rate would not: answers can get steadily less
                grounded for a long time before any single one crosses the
                threshold that labels it invented.
            for: 2h
            labels:
              severity: warning
            data:
              - refId: query
                relativeTimeRange: { from: 86400, to: 0 }
                datasourceUid: postgres
                model:
                  format: table
                  rawQuery: true
                  # - NULLs are skipped by avg() rather than counted as zero,
                  #   which is the whole reason that column is nullable. A run
                  #   where the judge was unreachable would otherwise read as a
                  #   collapse in quality.
                  rawSql: >-
                    SELECT round(avg(faithfulness)::numeric, 3) AS mean
                    FROM rag_evaluations
                    WHERE evaluated_at > now() - interval '24 hours'
                      AND faithfulness IS NOT NULL
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator: { type: lt, params: [0.8] }
                  refId: threshold
