name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # - 3.11 is what the image ships. 3.14 is what development happens on,
        #   and the dependency pins were chosen to satisfy both, so both get
        #   checked rather than assumed.
        python-version: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hecate
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: dataflow
      DB_PASSWORD: dataflow
      DB_NAME: hecate
      HECATE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Test
        run: pytest -q --cov=pipeline --cov-report=term-missing --cov-report=xml

      # - The suite passes whether or not the integration tests ran, because a
      #   skip is not a failure. That is how a green build ends up meaning
      #   nothing, so this checks they actually executed.
      - name: Integration tests must not have been skipped
        run: |
          pytest -m integration -q | tee integration.txt
          if grep -q "skipped" integration.txt; then
            echo "::error::integration tests skipped - they are supposed to run against the service container"
            exit 1
          fi
          grep -qE "[0-9]+ passed" integration.txt || {
            echo "::error::no integration tests ran at all"
            exit 1
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
